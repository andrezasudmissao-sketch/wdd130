<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <link rel="stylesheet" href="estilos/tabela.css">
</head>
<body>
    <table>
       
        <thead> <!--<thead> – Contém as linhas de cabeçalho da tabela-->
            </tr>
            <th>Liga</th> <!--<tr> – Cria uma linha na tabela (tr significa "table row")-->
            <th>Time</th>
            <th>Retrospecto (Vitória /Derrota)</th>
            <th>Número de Jogadores</th>
            </tr>
        </thead>
       
     
        <tbody>
               <tr>
                <td rowspan="2">Sul</td> <!--rowspan="2" – A célula se estende por 2 linhas.-->
                <td>Paraná</td> <!--<td> – Cria uma célula de dados da tabela (td significa "table data")-->
                <td>52-19</td>
                <td>23</td>
              </tr>

              <tr>
                <td>Santa catarina</td>
                <td>49-24</td>
                <td>10</td>
              </tr>

               <tr>
                <td rowspan="3">Oeste</td> <!--rowspan="3" – A célula se estende por 2 linhas.-->
                <td>Lacerda</td>
                <td>92-70</td>
                <td>27</td>
              </tr>

              <tr>
                <td>Acre</td>
                <td>75-87</td>
                <td>20</td>
              </tr>

              <tr>
                <td>Rondônia</td>
                <td>10-7</td>
                <td>12</td>
              </tr>
        </tbody>

        <tfoot>
          <tr>
            <td colspan="3">Total de jogadores</td>  <!--colspan="3" – A célula se estende por 3 colunas-->
            <td>92</td>
          </tr>
        </tfoot>

    </table>
  
</body>
</html>

<!-- colspan="2" – A célula se estende por 2 colunas
colspan="3" – A célula se estende por 3 colunas 

rowspan="2" – A célula se estende por 2 linhas.
rowspan="3" – A célula se estende por 3 linhas. -->
